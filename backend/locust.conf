# Locust Configuration File for Airplane Ticket Management System Load Testing
# Target: Nginx Reverse Proxy (http://localhost:80)

locustfile = locustfile.py
host = http://localhost:80
web-host = 0.0.0.0
web-port = 8089
headless = false
users = 100
spawn-rate = 10
run-time = 10m
autostart = false

# Rate Limiting & User Simulation Options:
# requests-per-minute: Target requests per minute per user (0 = unconstrained/full speed)
# randomize-client-ip: Simulate distinct client IP per user via X-Forwarded-For (default: true)
requests-per-minute = 0
randomize-client-ip = true
